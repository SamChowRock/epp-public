<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>本地模拟供应商 · 第54章</title>
<style>body{font:17px system-ui;background:#eef3f6;color:#142e3f;max-width:1160px;margin:40px auto;padding:24px}h1{font-size:30px}button{font:inherit;padding:10px 20px;background:#155f75;color:white;border:0;border-radius:7px}section{background:white;padding:20px;margin:18px 0;border-radius:12px;overflow:auto}pre{font:14px ui-monospace;white-space:pre-wrap}small{color:#506778}</style>
<h1>本地模拟供应商 · 发送与回执证据</h1><p>固定隔离库与配置中的任务 ID。此页只读；邮件正文和令牌只在私有 Mailpit 查看。</p><button id="refresh">读取当前事实</button><small id="time"></small><div id="content"></div>
<script>async function load(){const r=await fetch('/snapshot',{cache:'no-store'});const value=await r.json();document.querySelector('#time').textContent=' HTTP '+r.status+' · '+new Date().toLocaleTimeString();const root=document.querySelector('#content');root.replaceChildren();for(const [key,v] of Object.entries(value)){const s=document.createElement('section'),h=document.createElement('h2'),pre=document.createElement('pre');h.textContent=key;pre.textContent=JSON.stringify(v,null,2);s.append(h,pre);root.append(s)}}document.querySelector('#refresh').onclick=load;load()</script></html>
